<div class="card plan {{ r.css }}">
  <div class="row"><b>{{ r.plan.production_date|date:"d M" }} · {{ r.plan.plan_no }}</b><span class="badge {{ r.css }}">{{ r.label }}</span></div>
  <div class="sum" title="{{ r.summary }}">{{ r.summary }}</div>
  <div class="actions">
    <a class="mini" href="{% url 'floor:detail' r.plan.pk %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      দেখুন (View)</a>
    {% if r.edit_url %}
    <a class="mini" href="{{ r.edit_url }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      বদলান (Edit)</a>
    {% else %}
    <span class="mini off" title="শেষ হওয়া উৎপাদন শুধু Super Admin বদলাতে পারেন">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      লক (Locked)</span>
    {% endif %}
    <a class="mini" href="{% url 'floor:print' r.plan.pk %}?auto=1" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>
      প্রিন্ট / PDF</a>
    <a class="mini" href="{% url 'floor:history' r.plan.pk %}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
      ইতিহাস (History){% if r.history_count %} <span class="count">{{ r.history_count }}</span>{% endif %}</a>
  </div>
</div>
